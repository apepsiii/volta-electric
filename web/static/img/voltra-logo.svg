  </text>

  <defs>
    <linearGradient id="bolt-grad" x1="8" y1="2" x2="38" y2="48" gradientUnits="userSpaceOnUse">
      <stop stop-color="#bbf438"/>
      <stop offset="1" stop-color="#84cc16"/>
    </linearGradient>
  </defs>
</svg>

