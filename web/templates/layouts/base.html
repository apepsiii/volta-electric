{{define "base"}}
<!DOCTYPE html>
<html lang="id" class="scroll-smooth">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{.PageTitle}}</title>
  <meta name="description" content="PT Mega Karya Perkasa menghadirkan trafo distribusi berpendingin minyak merek dagang VOLTRA berstandar IEC dan SPLN. Handal, efisien, dan bergaransi resmi.">
  <meta name="keywords" content="voltra electric, pt mega karya perkasa, trafo voltra, trafo distribusi, trafo hermetik, trafo conservator, spln, iec, voltra-electric.id">

  <!-- Favicon -->
  <link rel="icon" type="image/svg+xml" href="/static/img/voltra-logo.svg">

  <!-- Google Fonts: Plus Jakarta Sans -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">

  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['"Plus Jakarta Sans"', 'sans-serif'],
          },
          colors: {
            brand: {
              lime: '#a8f020',
              limeHover: '#95db18',
              limeLight: '#f2fce2',
              blue: '#0284c7',
              dark: '#111827',
              grayBg: '#f8fafc',
            }
          }
        }
      }
    }
  </script>

  <!-- Custom CSS -->
  <link rel="stylesheet" href="/static/css/style.css">
</head>
<body class="antialiased selection:bg-[#a8f020] selection:text-black">

  <!-- Navbar -->
  {{template "navbar" .}}

  <!-- Main Content -->
  <main>
    {{template "content" .}}
  </main>

  <!-- Product Modal -->
  {{template "modal" .}}

  <!-- Footer -->
  {{template "footer" .}}

  <!-- Floating WhatsApp Action -->
  <a href="https://wa.me/{{.Config.ContactWA}}?text=Halo%20PT%20Mega%20Karya%20Perkasa,%20saya%20ingin%20konsultasi%20mengenai%20trafo%20VOLTRA%20(voltra-electric.id)" target="_blank" rel="noopener noreferrer" class="fixed bottom-6 right-6 z-40 bg-[#25D366] hover:bg-[#20ba59] text-white p-3.5 rounded-full shadow-2xl flex items-center justify-center transition-transform hover:scale-110 group" title="Chat WhatsApp Sales">
    <svg class="w-7 h-7" fill="currentColor" viewBox="0 0 24 24"><path d="M.057 24l1.687-6.163c-1.041-1.804-1.588-3.849-1.587-5.946.003-6.556 5.338-11.891 11.893-11.891 3.181.001 6.167 1.24 8.413 3.488 2.245 2.248 3.481 5.236 3.48 8.414-.003 6.557-5.338 11.892-11.893 11.892-1.99-.001-3.951-.5-5.688-1.448l-6.305 1.654zm6.597-3.807c1.676.995 3.276 1.591 5.392 1.592 5.448 0 9.886-4.434 9.889-9.885.002-5.462-4.415-9.89-9.881-9.892-5.452 0-9.887 4.434-9.889 9.884-.001 2.225.651 3.891 1.746 5.634l-.999 3.648 3.742-.981z"/></svg>
    <span class="max-w-0 overflow-hidden whitespace-nowrap group-hover:max-w-xs transition-all duration-300 text-xs font-bold pl-0 group-hover:pl-2">
      Hubungi Sales Kami
    </span>
  </a>

  <!-- Application Scripts -->
  <script src="/static/js/app.js"></script>
</body>
</html>
{{end}}
