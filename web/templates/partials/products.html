{{define "products"}}
<!-- OUR PRODUCT (MATCHING SCREENSHOT LAYOUT) -->
<section id="produk" class="py-20 bg-white">
  <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
    
    <!-- Section Header -->
    <div class="text-center max-w-3xl mx-auto mb-10">
      <h2 class="text-3xl sm:text-4xl font-extrabold text-slate-900 tracking-tight mb-2">
        Our Product
      </h2>
      <p class="text-sm sm:text-base text-slate-500">
        Trafo Distribusi Berpendingin Minyak (Oil-Immersed Distribution Transformers) Merek {{.Company.BrandName}}
      </p>
    </div>

    <!-- Category Filter Pills (Exact Volta Screenshot Style) -->
    <div class="flex flex-wrap justify-center items-center gap-2 sm:gap-3 mb-12">
      <button class="filter-btn active px-5 py-2 rounded-full text-xs font-bold transition-all bg-[#a8f020] text-slate-950 shadow-sm" data-filter="all">
        Semua Model
      </button>
      <button class="filter-btn px-5 py-2 rounded-full text-xs font-bold transition-all text-slate-600 hover:text-slate-900 hover:bg-slate-100" data-filter="hermetik">
        Tipe Hermetik (Fin Wall)
      </button>
      <button class="filter-btn px-5 py-2 rounded-full text-xs font-bold transition-all text-slate-600 hover:text-slate-900 hover:bg-slate-100" data-filter="conservator">
        Tipe Conservator
      </button>
      <button class="filter-btn px-5 py-2 rounded-full text-xs font-bold transition-all text-slate-600 hover:text-slate-900 hover:bg-slate-100" data-filter="nitrogen">
        Hermetik dengan Nitrogen
      </button>
      <button class="filter-btn px-5 py-2 rounded-full text-xs font-bold transition-all text-slate-600 hover:text-slate-900 hover:bg-slate-100" data-filter="custom">
        Kustom Industri & PLN
      </button>
    </div>

    <!-- Product Cards Grid (Matching Section 2 Screenshot Style) -->
    <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-6">

      {{range .Products}}
      <div class="product-card bg-[#f4f6f8] rounded-3xl p-6 flex flex-col justify-between transition-all duration-300 border border-slate-100" data-category="{{.Category}}">
        <div>
          <div class="flex justify-between items-start mb-4">
            <div>
              <span class="text-xs font-semibold text-slate-400 uppercase tracking-wider block">{{.Series}}</span>
              <h3 class="text-lg font-extrabold text-slate-900 leading-tight">{{.Name}}</h3>
            </div>
            <span class="bg-white text-slate-800 text-[10px] font-bold px-2 py-0.5 rounded shadow-sm">
              {{.Tag}}
            </span>
          </div>

          <!-- Product Visual -->
          <div class="py-6 flex items-center justify-center">
            <div class="relative w-48 h-48 rounded-2xl overflow-hidden bg-white shadow-sm flex items-center justify-center border border-slate-200/60 p-2">
              <img src="{{.ImageURL}}" alt="{{.Name}}" class="w-full h-full object-cover rounded-xl">
              <div class="absolute inset-0 bg-slate-950/10"></div>
              <span class="absolute bottom-2 left-2 bg-slate-900/90 text-white text-[9px] font-bold px-2 py-0.5 rounded">
                {{.Badge}}
              </span>
            </div>
          </div>

          <!-- Specs Snippet -->
          <ul class="text-xs text-slate-600 space-y-1.5 mb-6">
            {{range .Features}}
            <li class="flex items-center gap-2">
              <span class="w-1.5 h-1.5 rounded-full bg-sky-500 flex-shrink-0"></span>
              <span class="line-clamp-1">{{.}}</span>
            </li>
            {{end}}
          </ul>
        </div>

        <!-- Bottom Price / Rating & Arrow Action -->
        <div class="flex justify-between items-center pt-4 border-t border-slate-200">
          <div>
            <span class="text-[10px] text-slate-500 block">Kapasitas</span>
            <span class="text-sm font-extrabold text-slate-900">{{.Capacity}}</span>
          </div>
          <button onclick="openProductModal('{{.ID}}')" class="arrow-btn w-10 h-10 rounded-full bg-[#a8f020] text-slate-950 flex items-center justify-center shadow-md transition-all">
            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M9 5l7 7-7 7"/></svg>
          </button>
        </div>
      </div>
      {{end}}

    </div>

  </div>
</section>
{{end}}
